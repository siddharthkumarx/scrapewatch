rule: imperva.block
expect: {label: block, vendor: imperva}
features:
  status: 200
  headers: {content-type: text/html, x-iinfo: 13-12345678-0 0NNN RT(1700000000000 0), x-cdn: Imperva}
  content_type: text/html
  cookie_names: [visid_incap_123, incap_ses_456_123]
