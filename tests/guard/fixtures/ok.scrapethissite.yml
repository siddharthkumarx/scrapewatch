# Synthetic features shaped like a scrapethissite.com sandbox page (no page content).
expect: {label: ok}
features:
  status: 200
  headers: {content-type: text/html; charset=utf-8, server: nginx}
  content_type: text/html
  cookie_names: [session]
  title: "Countries of the World: A Simple Example | Scrape This Site"
  request_url: https://www.scrapethissite.com/pages/simple/
  body_bytes: 135000
  text_length: 14800
  text_density: 0.11
