  - {input: "&#x27;quoted&#x27;", options: {}, expect: {value: "'quoted'", changed: true}}
  - {input: "a &amp;amp; b", options: {}, expect: {value: "a & b", changed: true}}
  - {input: "R&D &amp; more", options: {}, expect: {value: "R&D & more", changed: true}}
  - {input: "&amp;amp;amp;amp;amp;amp;", options: {}, expect: {flag: undecidable}}
