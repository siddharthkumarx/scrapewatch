# Golden cases for the html_entities normalizer (docs/architecture.md 10.4).
cases:
  - {input: "Tom &amp; Jerry &#8211; 2", options: {}, expect: {value: "Tom & Jerry – 2", changed: true}}
  - {input: "Tom & Jerry", options: {}, expect: {}}
