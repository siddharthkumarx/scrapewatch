# Full matrix, extras, secret scan and dependency audit.
# Runs on every push to main, on pull requests and on demand (Actions are free for this
# public repository). Docs-only pushes skip it.
name: full

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "checks/results/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv sync --python ${{ matrix.python }} --group dev --extra httpx
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not live"

  extras:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        extra: ["requests", "playwright", "scrapy", "crawlee", "parquet"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      # crawlee's browser crawler needs the playwright extra as well
      - run: uv sync --python 3.12 --group dev --extra ${{ matrix.extra }} ${{ matrix.extra == 'crawlee' && '--extra playwright' || '' }}
      - name: Find integration tests
        id: tests
        run: |
          if [ -d tests/integrations ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "no integration tests yet"; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      # The browser and its apt dependencies are installed only when there are tests to run;
      # the apt step can take over ten minutes on a slow mirror, so it is capped.
      - if: steps.tests.outputs.present == 'true' && (matrix.extra == 'playwright' || matrix.extra == 'crawlee')
        timeout-minutes: 10
        run: uv run playwright install --with-deps chromium
      - name: Integration tests
        if: steps.tests.outputs.present == 'true'
        run: uv run pytest -m "not live" tests/integrations -k ${{ matrix.extra }} || [ $? -eq 5 ]

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The CLI scans the whole history; the action scans a push range, which fails on a
      # first push because the root commit has no parent.
      - name: Scan the whole history
        run: |
          v=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --group dev
      # Audit the locked dependencies; the project itself is not on PyPI yet.
      - name: Audit locked dependencies
        run: |
          uv export --no-emit-project --all-extras --group dev --no-hashes -q > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"
