# Live-check request. Pushing a change to this file runs .github/workflows/checks.yml, which
# commits results to checks/results/<id>/ on the same branch. Set enabled: true only when the
# run answers a question; set it back to false in the next commit that touches this file.
enabled: true
id: 2026-11-07-benchmark
question: "For docs/benchmarks.md (item 24): bytes before vs after the waste cutter on Playwright targets, guard labels per site, cost per usable record under a sample cost model on httpx targets, and the overhead numbers on the runner."
python: "3.12"
extras: [httpx, playwright, scrapy]   # parsel comes with scrapy; playwright installs Chromium
env:
  SCRAPEWATCH_PERF_OUT: benchmarks/output/perf.json
commands:             # run in order from the repo root; stdout/stderr captured to log.txt
  - python benchmarks/run_benchmark.py --out benchmarks/output --repeats 3 --shopify www.beardbrand.com www.kettleandfire.com www.partakefoods.com
  - python -m pytest tests/perf -m perf -s --no-cov -p no:cacheprovider -q
artifacts:            # results and per-run JSON summaries (no pages, no scraped data)
  - benchmarks/output/results.json
  - benchmarks/output/perf.json
  - "benchmarks/output/runs/**/*.json"
