# Live-check request. Pushing a change to this file runs .github/workflows/checks.yml, which
# commits results to checks/results/<id>/ on the same branch. Set enabled: false only when the
# run answers a question; set it back to false in the next commit that touches this file.
enabled: true
id: 2026-11-07-examples
question: "Do the four examples run against the live practice sites with verdict pass and at least one record each?"
python: "3.12"
extras: [httpx, playwright, scrapy]   # playwright installs Chromium in the workflow
env: {}
commands:             # run in order from the repo root; stdout/stderr captured to log.txt
  - sh examples/httpx_books/run.sh 5
  - sh examples/playwright_quotes/run.sh 3
  - sh examples/scrapy_scrapethissite/run.sh
  - sh examples/any_language/run.sh 3
  - python checks/examples_summary.py
artifacts:            # reports and JSON summaries only, not the scraped data
  - "examples/*/output/**/*.json"
  - "examples/*/output/**/*.html"
